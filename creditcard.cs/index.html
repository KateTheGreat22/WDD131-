<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Credit Card Form</title>
    <link rel="stylesheet" href="cardstyles.css">
</head>
<body>
    <form action="/submit_form" method="post">
    <div id="form-container">
        <div id="front-card-container">
            <div class="cardfront">
                <img src="favicon.png" alt="favicon" class="favicon" />
                <p class="money">Total: $200 </p>

                <label for="number">Card Number:</label>
                <input 
                    type="number" 
                    id="number" 
                    name="number" 
                    required 
                    minlength="13" 
                    maxlength="16"
                >
                
                <div class="cardholder-section">
                    <label for="name">Card Holder:</label>
                    <input 
                        type="text" 
                        id="name" 
                        name="name" 
                        required 
                    >
                </div>

                <div class="expiration-section">
                    <label for="Month">Expiration:</label>
                    <div>
                        <input 
                            type="text" 
                            id="Month" 
                            name="Month" 
                            placeholder="MM" 
                            required 
                            pattern="(0[1-9]|1[0-2])" 
                            title="Enter valid month (01–12)"
                            maxlength="2"
                        >
                        <input 
                            type="text" 
                            id="Year" 
                            name="Year" 
                            placeholder="YY" 
                            required 
                            pattern="\d{2}" 
                            title="Enter 2-digit year"
                            maxlength="2"
                        >
                    </div>
                </div>

                <div class="cvc-section">
                    <label for="CV">CVC/CVV:</label>
                    <input 
                        type="number" 
                        id="CV" 
                        name="CV" 
                        required 
                        minlength="3" 
                        maxlength="4" 
                    >
                    <p>Last 3 or 4 digits</p>
                </div>
            </div>
        </div>
        <div id="card-back-container">
            <div class="cardback">
                <div id="card-stripe"></div>
            </div>
        </div>
        <input type="submit" value="Submit" id="submit">
    </div>
</form>
</body>
</html>
