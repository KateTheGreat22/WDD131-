<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Discover delicious recipes from around the world. Find quick meals, desserts, and international cuisine.">
  <meta name="author" content="Kaitlyn Johnson">
  
  <!-- Social Media Meta Tags -->
  <meta property="og:title" content="Recipe Book - Delicious Recipes">
  <meta property="og:type" content="website">
  <meta property="og:description" content="Discover delicious recipes from around the world. Find quick meals, desserts, and international cuisine.">
  <meta property="og:image" content="https://yourdomain.com/Images/apple-crisp.jpg">
  <meta property="og:url" content="https://yourdomain.com/recipes">
  <meta name="twitter:card" content="summary_large_image">
  
  <link rel="icon" type="image/png" href="Images/recipe-book.png">
  <link rel="stylesheet" href="recipe.css">
  <script src="main.js" type="module" defer></script>
  <title>Recipe Book</title>
</head>
<body>
<header>
    <div class="logo">
        <img src="Images/recipe-book.png" alt="Recipe Book Logo">
        <h1>Recipe Book</h1>
    </div>
    <div class="search-container">
        <div class="search-form">
            <input 
                type="text" 
                class="search-input" 
                id="searchInput"
                placeholder="Find A Recipe"
                aria-label="Search">
            <button class="search-button" id="searchButton" aria-label="Search">
                <img src="Images/search.svg" alt="Search icon">
            </button>
        </div>

        <div class="results" id="results">
            <h3>Search Results</h3>
            <p id="resultsText"></p>
        </div>
    </div>
</header>

<main id="recipeContainer">
    <!-- Recipes will be dynamically inserted here -->
</main>

<div class="footer-container">
    <footer>
        <a href="https://www.flaticon.com/free-icons/recipe" 
        title="recipe icons">Recipe icons created by Freepik - Flaticon</a>
    </footer>
    
    <div class="social">
        <!-- Social media icons provided under CC from https://www.iconfinder.com/AlfredoCreates  -->
        <a href="#"><img src="Images/instagram_icon.svg" alt="instagram icon"></a>
        <a href="#"><img src="Images/youtube_icon.svg" alt="youtube icon"></a>
        <a href="#"><img src="Images/pinterest_icon.svg" alt="pinterest icon"></a>
    </div>
</div>
</body>
</html>
